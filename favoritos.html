<main id="main" class="page">
  <div class="wrap">
    <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span>/</span><span>Favoritos</span></nav>
    <header class="section--tight">
      <p class="eyebrow">Tu selección</p>
      <h1 class="section-title">Favoritos</h1>
      <p class="count" id="fav-count" aria-live="polite"></p>
    </header>
    <section class="section--tight">
      <div class="grid" id="fav-grid"></div>
      <div id="fav-empty" hidden></div>
    </section>
  </div>
</main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('vecchia:ready', function () {
  var V = window.Vecchia;
  function render() {
    var list = V.Wish.products();
    V.$('#fav-count').textContent = list.length
      ? list.length + (list.length === 1 ? ' fragancia guardada' : ' fragancias guardadas') : '';
    var empty = V.$('#fav-empty');
    if (!list.length) {
      empty.hidden = false;
      empty.innerHTML = '<div class="state"><p class="state__title">Aún no tienes favoritos</p>' +
        '<p class="state__text">Pulsa el corazón en cualquier fragancia para guardarla aquí. ' +
        'Se conserva aunque cierres la página.</p>' +
        '<a class="btn" href="catalogo.html">Explorar el catálogo</a></div>';
      V.$('#fav-grid').innerHTML = '';
      return;
    }
    empty.hidden = true; empty.innerHTML = '';
    V.renderGrid(V.$('#fav-grid'), list);
  }
  render();
  document.addEventListener('vecchia:ui', render);
});
</script>
