<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<a class="skip-link" href="#main">Saltar al contenido</a>
<noscript><div style="padding:1rem;background:#000;color:#fff;text-align:center;font-size:.85rem">
Esta tienda necesita JavaScript para el catálogo y el pedido.
<a href="https://wa.me/582735527411" style="color:#fff;text-decoration:underline">Escríbenos por WhatsApp</a>.
</div></noscript>

<main id="main" class="page">

  <!-- INTRO -->
  <section class="section" id="q-intro">
    <div class="wrap center">
      <p class="eyebrow">Test olfativo</p>
      <h1 class="section-title">¿Qué perfume soy?</h1>
      <p class="lede" style="margin-inline:auto">
        Ocho preguntas. Al final te decimos qué fragancia encaja con tu personalidad,
        tu clima y las ocasiones en las que te perfumas.
      </p>
      <div class="hero__actions" style="justify-content:center">
        <button class="btn" id="q-start">Comenzar experiencia</button>
      </div>
      <p class="meta mt-3">Dura menos de un minuto · No pedimos ningún dato</p>
    </div>
  </section>

  <!-- PREGUNTAS -->
  <section class="section" id="q-play" hidden aria-live="polite">
    <div class="wrap" style="max-width:820px">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:2rem">
        <p class="meta" id="q-step">Pregunta 1 de 8</p>
        <div style="flex:1;height:1px;background:var(--ink-12);position:relative">
          <span id="q-bar" style="position:absolute;inset:0 auto 0 0;background:var(--black);
                width:0;transition:width var(--t-base) var(--ease)"></span>
        </div>
      </div>
      <h2 class="section-title" id="q-text" style="margin-bottom:2rem"></h2>
      <div class="stack-sm" id="q-options" role="group" aria-labelledby="q-text"></div>
      <div class="hero__actions">
        <button class="btn btn--ghost" id="q-back">← Anterior</button>
      </div>
    </div>
  </section>

  <!-- ANALIZANDO -->
  <section class="section" id="q-loading" hidden>
    <div class="wrap center">
      <p class="eyebrow">Analizando tus respuestas</p>
      <h2 class="section-title">Buscando tu fragancia</h2>
      <div style="max-width:320px;margin:2rem auto 0;height:1px;background:var(--ink-12);position:relative">
        <span id="q-loadbar" style="position:absolute;inset:0 auto 0 0;background:var(--black);
              width:0;transition:width 1.4s linear"></span>
      </div>
    </div>
  </section>

  <!-- RESULTADO -->
  <section class="section" id="q-result" hidden></section>
</main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('vecchia:ready', function () {
  var V = window.Vecchia, $ = V.$, esc = V.esc;
  var PREGUNTAS = window.VECCHIA_QUIZ_PREGUNTAS || [];
  var PERFUMES  = window.VECCHIA_QUIZ_PERFUMES  || [];

  if (!PREGUNTAS.length || !PERFUMES.length) {
    $('#q-intro').innerHTML = '<div class="wrap"><div class="state">' +
      '<p class="state__title">El test no está disponible</p>' +
      '<p class="state__text">Vuelve a intentarlo en unos minutos.</p>' +
      '<a class="btn" href="catalogo.html">Ver catálogo</a></div></div>';
    return;
  }

  var idx = 0, respuestas = {};
  var elIntro = $('#q-intro'), elPlay = $('#q-play'),
      elLoad = $('#q-loading'), elRes = $('#q-result');

  function show(node) {
    [elIntro, elPlay, elLoad, elRes].forEach(function (n) { n.hidden = n !== node; });
  }

  function paint() {
    var q = PREGUNTAS[idx];
    $('#q-step').textContent = 'Pregunta ' + (idx + 1) + ' de ' + PREGUNTAS.length;
    $('#q-bar').style.width = (idx / PREGUNTAS.length * 100) + '%';
    $('#q-text').textContent = q.texto;
    $('#q-back').style.visibility = idx === 0 ? 'hidden' : 'visible';
    $('#q-options').innerHTML = q.opciones.map(function (o) {
      var on = respuestas[q.id] === o;
      return '<button class="btn ' + (on ? '' : 'btn--ghost') + '" data-opt="' + esc(o) + '" ' +
        'style="justify-content:flex-start;text-align:left">' + esc(o) + '</button>';
    }).join('');
  }

  $('#q-start').addEventListener('click', function () {
    idx = 0; respuestas = {}; show(elPlay); paint();
    elPlay.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('#q-back').addEventListener('click', function () {
    if (idx > 0) { idx--; paint(); }
  });

  $('#q-options').addEventListener('click', function (e) {
    var b = e.target.closest('[data-opt]'); if (!b) return;
    respuestas[PREGUNTAS[idx].id] = b.getAttribute('data-opt');
    if (idx < PREGUNTAS.length - 1) { idx++; paint(); }
    else finalizar();
  });

  /* Algoritmo original conservado: suma de p.puntos[preguntaId][opcion] */
  function calcular() {
    var scores = {};
    PERFUMES.forEach(function (p) { scores[p.id] = 0; });
    Object.keys(respuestas).forEach(function (pid) {
      var opcion = respuestas[pid];
      PERFUMES.forEach(function (p) {
        var pts = p.puntos && p.puntos[pid];
        if (pts && pts[opcion] !== undefined) scores[p.id] += pts[opcion];
      });
    });
    var best = PERFUMES[0], max = -Infinity;
    PERFUMES.forEach(function (p) {
      if (scores[p.id] > max) { max = scores[p.id]; best = p; }
    });
    return best;
  }

  function finalizar() {
    show(elLoad);
    elLoad.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(function () { $('#q-loadbar').style.width = '100%'; }, 60);
    setTimeout(function () { pintarResultado(calcular()); }, 1500);
  }

  function pintarResultado(p) {
    /* ¿Existe esa fragancia en el catálogo? Si sí, enlazamos a su ficha real. */
    var n = V.norm(p.nombre);
    var match = V.products.filter(function (x) {
      var xn = V.norm(x.name);
      return xn === n || xn.indexOf(n) === 0 || n.indexOf(xn) === 0;
    })[0];

    elRes.innerHTML = '<div class="wrap">' +
      '<div class="center" style="margin-bottom:clamp(2rem,5vw,3.5rem)">' +
        '<p class="eyebrow">Tu fragancia</p>' +
        '<h2 class="section-title">' + esc(p.nombre) + '</h2>' +
        '<p class="meta">' + esc(p.familia) + '</p>' +
      '</div>' +
      '<div class="pdp">' +
        '<div class="pdp__media">' +
          (p.imagen ? '<img src="' + esc(p.imagen) + '" alt="' + esc(p.nombre) + '" ' +
            'decoding="async" onerror="this.style.opacity=.18">' :
            '<span class="card__media--empty meta">Sin imagen</span>') +
        '</div>' +
        '<div class="pdp__info">' +
          (p.personalidad ? '<p class="lede">' + esc(p.personalidad) + '</p>' : '') +
          (p.descripcion ? '<p class="pdp__desc mt-3">' + esc(p.descripcion) + '</p>' : '') +

          '<div class="mt-3"><p class="eyebrow">Pirámide olfativa</p>' +
          '<dl class="notes-grid">' +
            (p.top   ? '<div class="note"><dt>Salida</dt><dd>' + esc(p.top) + '</dd></div>' : '') +
            (p.heart ? '<div class="note"><dt>Corazón</dt><dd>' + esc(p.heart) + '</dd></div>' : '') +
            (p.base  ? '<div class="note"><dt>Fondo</dt><dd>' + esc(p.base) + '</dd></div>' : '') +
          '</dl></div>' +

          '<dl class="spec mt-3">' +
            (p.duracion   ? '<dt>Duración</dt><dd>' + esc(p.duracion) + '</dd>' : '') +
            (p.proyeccion ? '<dt>Proyección</dt><dd>' + esc(p.proyeccion) + '</dd>' : '') +
            (p.temporada  ? '<dt>Temporada</dt><dd>' + esc(p.temporada) + '</dd>' : '') +
            (p.ocasion    ? '<dt>Ocasión</dt><dd>' + esc(p.ocasion) + '</dd>' : '') +
          '</dl>' +

          '<div class="hero__actions">' +
            (match
              ? '<a class="btn" href="producto.html?id=' + esc(match.id) + '">Ver en el catálogo</a>'
              : '<a class="btn" target="_blank" rel="noopener" href="' +
                V.waLink('Hola VECCHIA, hice el test y me salió ' + p.nombre + '. ¿Lo tienen disponible?') +
                '">Consultar por WhatsApp</a>') +
            '<button class="btn btn--ghost" id="q-again">Repetir el test</button>' +
          '</div>' +
          '<div class="hero__actions" style="margin-top:.5rem">' +
            '<button class="btn btn--ghost btn--block" id="q-share">Compartir resultado</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="section-head" style="margin-top:clamp(3rem,7vw,5rem)">' +
        '<div><p class="eyebrow">Del catálogo</p>' +
        '<h3 class="section-title">Fragancias afines</h3></div></div>' +
      '<div class="grid" id="q-related"></div>' +
    '</div>';

    show(elRes);
    elRes.scrollIntoView({ behavior: 'smooth', block: 'start' });

    $('#q-again').addEventListener('click', function () {
      idx = 0; respuestas = {}; $('#q-loadbar').style.width = '0';
      show(elIntro); elIntro.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    $('#q-share').addEventListener('click', function () {
      var txt = 'Hice el test de VECCHIA Perfumes y mi fragancia es ' + p.nombre + '.';
      if (navigator.share) {
        navigator.share({ title: 'VECCHIA Perfumes', text: txt, url: location.href })
          .catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(txt + ' ' + location.href)
          .then(function () { V.Toast.show('Resultado copiado', 'check'); })
          .catch(function () { V.Toast.show('No se pudo copiar'); });
      } else V.Toast.show('Copia el enlace desde la barra del navegador');
    });

    /* Afines reales del catálogo, por familia olfativa o marca */
    var fam = V.norm(p.familia || ''), marca = V.norm((p.nombre || '').split(' ')[0]);
    var rel = V.products.filter(function (x) {
      if (match && x.id === match.id) return false;
      var hay = V.norm(x.brand + ' ' + (x.tags || []).join(' ') + ' ' + x.familyLabel);
      return (marca && hay.indexOf(marca) !== -1) ||
             (fam && fam.split(/\s+/).some(function (w) { return w.length > 3 && hay.indexOf(w) !== -1; }));
    });
    if (rel.length < 4) {
      rel = rel.concat(V.products.filter(function (x) {
        return !x.soldOut && rel.indexOf(x) === -1 && (!match || x.id !== match.id);
      }));
    }
    V.renderGrid($('#q-related'), rel.slice(0, 4));
  }
});
</script>
</body>
</html>
